[workspace]
channels = ["conda-forge", "bioconda"]
name = "glofas-anadyr"
platforms = ["linux-64"]

[dependencies]
boto3 = ">=1.42.9"
cdsapi = "==0.7.7"
fastparquet = ">=2024.11.0"
geopandas = ">=1.1.1"
h5netcdf = ">=1.7.3"
netcdf4 = ">=1.7.3"
numpy = "==2.3.5"
pandas = ">=2.3.3"
pyarrow = ">=22.0.0"
python = "3.12.*"
python-dotenv = ">=1.0.0"
snakemake = ">=9.15,<10"
xarray = ">=2025.12.0"

[pypi-dependencies]
hydroeval = ">=0.1.0"
xsdba = "==0.5.0"

[tasks]
workflow = 'snakemake --software-deployment-method apptainer --apptainer-args "--env-file .env" --cores 1'
